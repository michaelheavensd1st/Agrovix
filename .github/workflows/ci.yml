name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Install & cache (Node)
  # ---------------------------------------------------------------------------
  install:
    name: Install dependencies (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ---------------------------------------------------------------------------
  # 2. TypeScript / JS lint + type-check + format check
  # ---------------------------------------------------------------------------
  web-lint:
    name: Web + Packages Lint & Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  # ---------------------------------------------------------------------------
  # 3. Web unit tests (Vitest)
  # ---------------------------------------------------------------------------
  web-test:
    name: Web Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm --filter @agrovix/web test -- --run

  # ---------------------------------------------------------------------------
  # 4. Web build verification
  # ---------------------------------------------------------------------------
  web-build:
    name: Web Build Verification
    runs-on: ubuntu-latest
    needs: [web-lint, web-test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: pnpm --filter @agrovix/web build

  # ---------------------------------------------------------------------------
  # 5. Python (FastAPI) lint + type + tests
  # ---------------------------------------------------------------------------
  api-quality:
    name: API Lint, Format & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrovix
          POSTGRES_PASSWORD: agrovix_dev
          POSTGRES_DB: agrovix_agos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrovix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://agrovix:agrovix_dev@localhost:5432/agrovix_agos_test
          DATABASE_URL_SYNC: postgresql+psycopg2://agrovix:agrovix_dev@localhost:5432/agrovix_agos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-do-not-use-in-prod
        run: pytest -v --cov=app --cov-report=xml

  # ---------------------------------------------------------------------------
  # 6. Alembic upgrade-to-head validation (real Postgres)
  # Codex Review Gate 01, finding CRG01-3: guarantees migrations apply
  # cleanly against a fresh Postgres database on every PR.
  # ---------------------------------------------------------------------------
  alembic-upgrade:
    name: Alembic upgrade → head (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrovix
          POSTGRES_PASSWORD: agrovix_dev
          POSTGRES_DB: agrovix_agos_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrovix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: alembic current (before)
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://agrovix:agrovix_dev@localhost:5432/agrovix_agos_migrate
        run: alembic current

      - name: alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://agrovix:agrovix_dev@localhost:5432/agrovix_agos_migrate
        run: alembic upgrade head

      - name: alembic current (after) — must match head
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://agrovix:agrovix_dev@localhost:5432/agrovix_agos_migrate
        run: |
          set -euo pipefail
          HEAD=$(alembic heads | awk '{print $1}')
          CURRENT=$(alembic current | awk '{print $1}')
          echo "head=$HEAD current=$CURRENT"
          test "$HEAD" = "$CURRENT"

      - name: alembic downgrade base + upgrade head (round-trip)
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://agrovix:agrovix_dev@localhost:5432/agrovix_agos_migrate
        run: |
          alembic downgrade base
          alembic upgrade head

  # ---------------------------------------------------------------------------
  # 7. Mongo-guard — production code must not depend on MongoDB
  # ---------------------------------------------------------------------------
  mongo-guard:
    name: Mongo Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no MongoDB references in apps/ or packages/
        run: bash scripts/verify-no-mongo.sh

  # ---------------------------------------------------------------------------
  # 6. Security / dependency audit (non-blocking in Sprint 0)
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security Audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --prod || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r apps/api/requirements.txt || true
